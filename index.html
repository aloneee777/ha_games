<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Cyber Runner Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-deep: #05050a;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-yellow: #f3e600;
      --text-main: #ffffff;
    }

    * { box-sizing: border-box; touch-action: manipulation; }

    body {
      background: radial-gradient(circle at center, #130f26 0%, var(--bg-deep) 100%);
      color: var(--text-main);
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
      margin: 0;
      padding: 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .game-wrapper {
      width: 100%;
      max-width: 380px;
      background: rgba(15, 15, 30, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 243, 255, 0.1);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-info {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
    }

    .score-box {
      background: rgba(243, 230, 0, 0.1);
      border: 1px solid rgba(243, 230, 0, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--neon-yellow);
    }

    canvas {
      background: #020205;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
      width: 100%;
      max-width: 348px;
      height: 380px;
      display: block;
    }

    .controls-grid {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.1), rgba(0, 243, 255, 0.2));
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      padding: 16px;
      border-radius: 14px;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 243, 255, 0.2);
      transition: 0.1s;
    }

    .btn-action:active {
      background: var(--neon-cyan);
      color: #000;
      transform: scale(0.95);
      box-shadow: 0 2px 8px var(--neon-cyan);
    }

    .btn-jump {
      border-color: var(--neon-pink);
      color: var(--neon-pink);
      background: linear-gradient(135deg, rgba(255, 0, 85, 0.1), rgba(255, 0, 85, 0.2));
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.2);
    }

    .btn-jump:active {
      background: var(--neon-pink);
      color: #fff;
      box-shadow: 0 2px 8px var(--neon-pink);
    }

    .game-over-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 5, 10, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border-radius: 20px;
    }

    .game-over-screen h2 {
      color: var(--neon-pink);
      font-size: 1.8rem;
      margin-bottom: 5px;
      text-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
    }

    .btn-restart {
      margin-top: 20px;
      background: var(--neon-cyan);
      color: #000;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    }
  </style>
</head>
<body>

  <div class="game-wrapper" style="position: relative;">
    <!-- Game Over Overlay -->
    <div id="gameOverScreen" class="game-over-screen">
      <h2>БОЗӢ ТАМОМ ШУД</h2>
      <p id="finalScore" style="color: #fff; font-size: 1rem; margin: 0;">Холи ниҳоӣ: 0</p>
      <button class="btn-restart" onclick="restartGame()">АЗ НАВ БОЗӢ КАРДАН</button>
    </div>

    <div class="header-info">
      <div class="title">⚡ CYBER RUNNER</div>
      <div class="score-box" id="scoreEl">Хол: 0</div>
    </div>

    <canvas id="gameCanvas" width="348" height="380"></canvas>

    <div class="controls-grid">
      <button class="btn-action" onclick="movePlayer(-1)">◀ ЧАП</button>
      <button class="btn-action btn-jump" onclick="jumpPlayer()">⬆️ ПАРИДАН</button>
      <button class="btn-action" onclick="movePlayer(1)">РОСТ ▶</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');

    let player = { x: 154, y: 300, w: 40, h: 40, targetX: 154, vy: 0, isJumping: false };
    let obstacles = [];
    let particles = [];
    let score = 0;
    let gameInterval = null;
    let gameSpeed = 4;
    let isPlaying = true;

    const lanes = [64, 154, 244];

    function movePlayer(dir) {
      if (!isPlaying) return;
      let currentIndex = lanes.indexOf(player.targetX);
      let newIndex = currentIndex + dir;
      if (newIndex >= 0 && newIndex < lanes.length) {
        player.targetX = lanes[newIndex];
        tg.HapticFeedback.impactOccurred('light');
      }
    }

    function jumpPlayer() {
      if (!isPlaying || player.isJumping) return;
      player.vy = -11;
      player.isJumping = true;
      tg.HapticFeedback.impactOccurred('medium');
    }

    function spawnObstacle() {
      let randomLane = lanes[Math.floor(Math.random() * lanes.length)];
      let types = ['box', 'laser'];
      let type = types[Math.floor(Math.random() * types.length)];
      obstacles.push({ x: randomLane, y: -60, w: 40, h: 40, type: type });
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: x + 20, y: y + 20,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 20,
          color: color
        });
      }
    }

    function update() {
      if (!isPlaying) return;

      score++;
      gameSpeed = 4 + Math.floor(score / 200);

      player.x += (player.targetX - player.x) * 0.2;

      if (player.isJumping) {
        player.y += player.vy;
        player.vy += 0.8;
        if (player.y >= 300) {
          player.y = 300;
          player.isJumping = false;
        }
      }

      if (Math.random() < 0.035 + (score / 10000)) {
        spawnObstacle();
      }

      obstacles.forEach((obs, index) => {
        obs.y += gameSpeed;

        if (
          Math.abs(player.x - obs.x) < 30 &&
          Math.abs(player.y - obs.y) < 30 &&
          player.y >= 260
        ) {
          isPlaying = false;
          tg.HapticFeedback.notificationOccurred('error');
          createParticles(player.x, player.y, '#ff0055');
          finalScoreEl.innerText = 'Холи ниҳоӣ: ' + score;
          gameOverScreen.style.display = 'flex';
        }

        if (obs.y > 400) {
          obstacles.splice(index, 1);
        }
      });

      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(index, 1);
      });

      scoreEl.innerText = 'Хол: ' + score;
    }

    function draw() {
      ctx.fillStyle = '#020205';
      ctx.fillRect(0, 0, 348, 380);

      ctx.strokeStyle = 'rgba(0, 243, 255, 0.12)';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 10]);
      [104, 194].forEach(lx => {
        ctx.beginPath();
        ctx.moveTo(lx, 0);
        ctx.lineTo(lx, 380);
        ctx.stroke();
      });
      ctx.setLineDash([]);

      obstacles.forEach(obs => {
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff0055';
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(obs.x - 20, obs.y, obs.w, obs.h);
        ctx.shadowBlur = 0;
      });

      ctx.shadowBlur = 20;
      ctx.shadowColor = '#00f3ff';
      ctx.fillStyle = '#00f3ff';
      ctx.fillRect(player.x - 20, player.y, player.w, player.h);
      ctx.shadowBlur = 0;

      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
    }

    function loop() {
      update();
      draw();
      if (isPlaying) {
        gameInterval = requestAnimationFrame(loop);
      }
    }

    function restartGame() {
      obstacles = [];
      particles = [];
      score = 0;
      gameSpeed = 4;
      player.x = 154;
      player.targetX = 154;
      player.y = 300;
      player.isJumping = false;
      isPlaying = true;
      gameOverScreen.style.display = 'none';
      loop();
    }

    loop();
  </script>
</body>
</html>
