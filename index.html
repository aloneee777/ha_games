<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>H-A Gaming Hub with Voice</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      background-color: #0f0f1a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
      user-select: none;
    }
    h1 { color: #00d2ff; margin: 10px 0 5px; }
    p { color: #aaa; margin-bottom: 15px; font-size: 0.9rem; }
    
    /* VOICE CHAT PANEL */
    .voice-panel {
      background: #1e1e2f;
      border: 1px solid #00d2ff;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .voice-btn {
      background: #00d2ff;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .voice-btn.active {
      background: #ff0055;
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 360px;
      margin: 0 auto;
    }
    .card {
      background: #1e1e2f;
      padding: 15px 10px;
      border-radius: 15px;
      border: 1px solid #333;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .card:active { transform: scale(0.96); }
    .card h3 { margin: 8px 0 0 0; font-size: 0.95rem; color: #fff; }
    .icon { font-size: 2.2rem; }
    .full-width { grid-column: span 2; }
    
    .game-screen { display: none; }
    canvas { background: #111; border-radius: 10px; margin-top: 10px; border: 2px solid #333; }
    
    .btn-back {
      padding: 10px 20px;
      background: #ff0055;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- MENU -->
  <div id="menu">
    <h1>H-A Gaming Hub</h1>
    <p>Бозӣ интихоб кун ва бо рафиқон гап зан:</p>

    <!-- VOICE PANEL -->
    <div class="voice-panel">
      <div style="text-align: left;">
        <div style="font-weight: bold; font-size: 0.9rem;">🎙️ Овози мустақим</div>
        <div id="voice-status" style="font-size: 0.75rem; color: #aaa;">Хомӯш аст</div>
      </div>
      <button id="v-btn" class="voice-btn" onclick="toggleVoice()">Пайваст шудан</button>
    </div>

    <div class="grid">
      <div class="card" onclick="startRacing()">
        <div class="icon">🏎️</div>
        <h3>2D Racing</h3>
      </div>
      <div class="card" onclick="startShooter()">
        <div class="icon">🚀</div>
        <h3>2D Shooter</h3>
      </div>
      <div class="card" onclick="startFootball()">
        <div class="icon">⚽</div>
        <h3>1v1 Football</h3>
      </div>
      <div class="card" onclick="startPuzzle()">
        <div class="icon">🔩</div>
        <h3>Screw Puzzle</h3>
      </div>
      <div class="card full-width" onclick="startMaze()">
        <div class="icon">↗️</div>
        <h3>Arrow Maze</h3>
      </div>
    </div>
  </div>

  <!-- GAME DISPLAY -->
  <div id="game-container" class="game-screen">
    <h2 id="game-title" style="margin:5px 0;">Бозӣ</h2>
    <div id="score" style="color:#00d2ff; font-weight:bold;">Очко: 0</div>
    <canvas id="canvas" width="280" height="320"></canvas>
    <br>
    <button class="btn-back" onclick="showMenu()">← Баргаштан ба меню</button>
  </div>

  <script>
    // Telegram WebApp init
    let tg = window.Telegram.WebApp;
    tg.expand();

    const menu = document.getElementById('menu');
    const container = document.getElementById('game-container');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const title = document.getElementById('game-title');
    const scoreEl = document.getElementById('score');
    let gameLoop = null;
    let localStream = null;
    let isVoiceActive = false;

    // VOICE CHAT FUNCTIONALITY
    async function toggleVoice() {
      const vBtn = document.getElementById('v-btn');
      const vStatus = document.getElementById('voice-status');

      if (!isVoiceActive) {
        try {
          // Дархости иҷозати микрофон аз телефони корбар
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          isVoiceActive = true;
          vBtn.innerText = "Қатъ кардан";
          vBtn.classList.add('active');
          vStatus.innerText = "Микрофон фаъол аст (Пашида истодааст)";
          tg.HapticFeedback.notificationOccurred('success');
        } catch (err) {
          alert('Хатогӣ дар пайваст кардани микрофон: ' + err.message);
        }
      } else {
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }
        isVoiceActive = false;
        vBtn.innerText = "Пайваст шудан";
        vBtn.classList.remove('active');
        vStatus.innerText = "Хомӯш аст";
        tg.HapticFeedback.notificationOccurred('warning');
      }
    }

    function showMenu() {
      if (gameLoop) clearInterval(gameLoop);
      container.style.display = 'none';
      menu.style.display = 'block';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function prepareGame(name) {
      if (gameLoop) clearInterval(gameLoop);
      menu.style.display = 'none';
      container.style.display = 'block';
      title.innerText = name;
    }

    // 1. 2D Racing
    function startRacing() {
      prepareGame('🏎️ 2D Racing');
      let carX = 120, score = 0;
      canvas.onclick = (e) => {
        let rect = canvas.getBoundingClientRect();
        let x = e.clientX - rect.left;
        carX = x < 140 ? 70 : 190;
      };
      gameLoop = setInterval(() => {
        score += 1;
        scoreEl.innerText = 'Масофа: ' + score;
        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, 280, 320);
        ctx.fillStyle = '#00d2ff';
        ctx.fillRect(carX, 240, 40, 60);
      }, 30);
    }

    // 2. 2D Shooter
    function startShooter() {
      prepareGame('🚀 2D Shooter');
      let score = 0;
      canvas.onclick = () => { score += 10; tg.HapticFeedback.impactOccurred('medium'); };
      gameLoop = setInterval(() => {
        scoreEl.innerText = 'Очко: ' + score;
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, 280, 320);
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(120, 50, 40, 40);
        ctx.fillStyle = '#00d2ff';
        ctx.fillRect(130, 270, 20, 20);
      }, 30);
    }

    // 3. 1v1 Football
    function startFootball() {
      prepareGame('⚽ 1v1 Football');
      let ballX = 140, ballY = 160, time = 60;
      gameLoop = setInterval(() => {
        if(time > 0) time--;
        scoreEl.innerText = 'Вақт: ' + time + 'с';
        ctx.fillStyle = '#1e7e34';
        ctx.fillRect(0, 0, 280, 320);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(ballX, ballY, 10, 0, Math.PI*2);
        ctx.fill();
      }, 1000);
    }

    // 4. Screw Puzzle
    function startPuzzle() {
      prepareGame('🔩 Screw Puzzle');
      scoreEl.innerText = 'Пазлҳо: 0/5';
      ctx.fillStyle = '#222';
      ctx.fillRect(0,0,280,320);
      ctx.fillStyle = '#ffcc00';
      ctx.font = '15px Arial';
      ctx.fillText('Гайкаҳоро кушоед...', 60, 160);
    }

    // 5. Arrow Maze
    function startMaze() {
      prepareGame('↗️ Arrow Maze');
      scoreEl.innerText = 'Сатҳ: 1';
      ctx.fillStyle = '#222';
      ctx.fillRect(0,0,280,320);
      ctx.fillStyle = '#00ffcc';
      ctx.font = '15px Arial';
      ctx.fillText('Лабиринти стрелкаҳо...', 55, 160);
    }
  </script>
</body>
</html>
