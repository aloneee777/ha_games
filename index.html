<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H-A Gaming Hub</title>
  <style>
    body {
      background-color: #0f0f1a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    h1 { color: #00d2ff; margin-bottom: 5px; }
    p { color: #aaa; margin-bottom: 25px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 400px;
      margin: 0 auto;
    }
    .card {
      background: #1e1e2f;
      padding: 20px 10px;
      border-radius: 15px;
      border: 1px solid #333;
      cursor: pointer;
    }
    .card h3 { margin: 10px 0 0 0; font-size: 1.1rem; color: #fff; }
    .icon { font-size: 2.5rem; }
    .full-width { grid-column: span 2; }
  </style>
</head>
<body>
  <h1>H-A Gaming Hub</h1>
  <p>Бозиро интихоб кунед:</p>

  <div class="grid">
    <div class="card" onclick="alert('Snake ба наздикӣ кушода мешавад!')">
      <div class="icon">🐍</div>
      <h3>Snake</h3>
    </div>
    <div class="card" onclick="alert('Flappy Bird ба наздикӣ кушода мешавад!')">
      <div class="icon">🐦</div>
      <h3>Flappy Bird</h3>
    </div>
    <div class="card" onclick="alert('2048 ба наздикӣ кушода мешавад!')">
      <div class="icon">🔢</div>
      <h3>2048</h3>
    </div>
    <div class="card" onclick="alert('Space Shooter ба наздикӣ кушода мешавад!')">
      <div class="icon">🚀</div>
      <h3>Space Shooter</h3>
    </div>
    <div class="card full-width" onclick="alert('Tetris ба наздикӣ кушода мешавад!')">
      <div class="icon">🧱</div>
      <h3>Tetris</h3>
    </div>
  </div>
</body>
</html>
