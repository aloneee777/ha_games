<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H-A Gaming Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0e15;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .splash {
      text-align: center;
    }
    .logo {
      font-size: 50px;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
    }
    .btn {
      margin-top: 30px;
      padding: 12px 30px;
      font-size: 18px;
      color: #fff;
      background: linear-gradient(135deg, #7F00FF, #E100FF);
      border: none;
      border-radius: 25px;
      box-shadow: 0 0 15px rgba(225, 0, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">H-A</div>
    <p>Ultimate Mini Games Hub</p>
    <button class="btn">Play Games</button>
  </div>
</body>
</html>
